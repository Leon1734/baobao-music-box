# AndroidX 必须显式开启
# AGP 8 下如果忘了这一行，:app:checkReleaseAarMetadata 会直接失败：
#   "Configuration ':app:releaseRuntimeClasspath' contains AndroidX dependencies,
#    but the 'android.useAndroidX' property is not enabled"
android.useAndroidX=true
# 工程里没有用旧 support 库，不需要 jetifier（开着会拖慢构建）
android.enableJetifier=false

# 非 ASCII 工程名/资源名（音源/ 目录）需要 UTF-8，否则 Windows 上会乱码
org.gradle.jvmargs=-Xmx2560m -Dfile.encoding=UTF-8

# 构建性能
org.gradle.parallel=true
org.gradle.caching=true
kotlin.code.style=official
