name: Android APK

# 云端构建安卓版 APK。
# 为什么不在本地构建：本地没有 Android SDK（要下几个 GB），
# GitHub 的 runner 自带 SDK + JDK 17，公开仓库 Actions 免费。
#
# 触发方式：
#   · 手动：Actions 页面点 "Run workflow"
#   · 打 tag（v*）：自动构建并把 APK 传到 Release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: '把 APK 附到这个已存在的 Release tag（留空则只上传 artifact）'
        required: false
        default: ''
  push:
    tags:
      - 'v*'
    branches:
      - main
    paths:
      - 'android/**'
      - 'server.py'
      - 'player.html'
      - 'tools/sync_android_assets.py'
      - '.github/workflows/android.yml'

permissions:
  contents: write        # 发 Release 需要

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Python（跑资源同步脚本）
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle.kts', 'android/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: 同步播放器代码到 Android 工程
        run: python tools/sync_android_assets.py

      - name: 设置 Gradle 8.9
        # 必须锁版本：runner 自带 Gradle 9.x，而 AGP 8.5 不兼容 Gradle 9
        # （wrapper 任务要先评估构建脚本，会直接 BUILD FAILED）
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: 构建 Release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: 收集产物
        run: |
          mkdir -p out
          find android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          ls -lh out/

      - name: 重命名（ASCII 文件名，中文会被 GitHub 吞掉）
        run: |
          cd out
          for f in *.apk; do mv "$f" "baobao-music-box-v1.1.0-android.apk"; done
          ls -lh

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: baobao-music-box-android
          path: out/*.apk
          if-no-files-found: error

      - name: 附到 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          fail_on_unmatched_files: false

      # 把 APK 传到【已存在】的 Release 上（手动触发时用 release_tag 指定）
      # 为什么需要：本机到 GitHub 下载 CDN 只有 ~21KB/s，18MB 要下 15 分钟，
      # 所以不让本地下载再上传，直接让 CI 传。
      - name: 附到已存在的 Release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" out/*.apk --clobber
          echo "已附到 ${{ inputs.release_tag }}"
          gh release view "${{ inputs.release_tag }}" --json assets --jq '.assets[] | "\(.name)  \(.size) B"'
